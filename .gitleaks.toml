# Secret scan configuration (NFR-SEC-04, T-12). Used by the pre-commit hook
# and, from WP-1.3, by the `static` job and the full-history scan.
title = "Heap Academy secret scan"

[extend]
useDefault = true

[[rules]]
id = "supabase-secret-key"
description = "Supabase secret API key"
regex = '''\bsb_secret_[A-Za-z0-9_-]{20,}'''
keywords = ["sb_secret_"]

[[rules]]
id = "resend-api-key"
description = "Resend API key"
regex = '''\bre_[A-Za-z0-9]{6,}_[A-Za-z0-9]{16,}\b'''
entropy = 3.0
keywords = ["re_"]

# Requirement ID lists in the specification, such as
# "FR-AUTH-01 to FR-AUTH-06, NFR-COMPAT-02", look like an API key to the
# generic rule. Narrow on purpose: that rule only, Markdown under docs/ only,
# and only when the match is a list of requirement IDs.
[[allowlists]]
description = "Requirement ID lists in the specification"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^docs/.*\.md$''']
regexTarget = "match"
regexes = ['''^(?:N?FR|T|G|A|E)-[A-Z0-9]+(?:-\d{2})?\b[\sA-Za-z0-9,;:-]*$''']
