# The pull request pipeline (docs/spec/07-operations.md section 2.1). The job
# names are the required checks of docs/spec/05-engineering-handbook.md
# section 10: renaming one is a spec change.
#
# Rules: .claude/rules/ci.md. Actions pinned by commit, no permissions by
# default, a timeout on every job, the frozen lockfile, no secrets.
name: CI

on:
  pull_request:
    # `edited`: the attribution check must see the final title and description.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # The fake values of .env.example. The build validates the public ones; no
  # job reaches Supabase or Resend.
  NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_example
  # Cloudflare's published Turnstile test key, which always passes.
  NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
  # The local value of .env.example. `supabase start` stores it as the Vault
  # secret action_counter_key (supabase/config.toml), and the app signs its
  # rate limit counts with it. Not a secret.
  ACTION_COUNTER_KEY: local-only-action-counter-key-not-a-secret
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  static:
    name: static
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The attribution check and the secret scan read every commit in range.
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      # Every check that must not be loosened by the pull request it checks
      # runs here, before any step runs the pull request's own code
      # (`pnpm install`, lint): that code could put a fake `node` or
      # `gitleaks` on the path of every later step. The checks, the secret
      # scan's rules and ignore file, and the gitleaks installer come from the
      # base commit. Only a file that does not exist yet on the base is taken
      # from the pull request. What stays with the pull request is this
      # workflow file itself: a change to it is pushed by the owner.
      - name: The commit range
        id: range
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          if [ -n "$PR_BASE" ]; then
            echo "range=$PR_BASE..$PR_HEAD" >> "$GITHUB_OUTPUT"
          elif [ "$PUSH_BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "range=$PUSH_AFTER" >> "$GITHUB_OUTPUT"
          else
            echo "range=$PUSH_BEFORE..$PUSH_AFTER" >> "$GITHUB_OUTPUT"
          fi
      - name: The checks from the base commit
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          base=${PR_BASE:-$PUSH_BEFORE}
          mkdir "$RUNNER_TEMP/checks" "$RUNNER_TEMP/checks/ignore" "$RUNNER_TEMP/bin"
          for file in scripts/check-attribution.mjs .gitleaks.toml scripts/install-gitleaks.sh; do
            if git cat-file -e "$base:$file" 2>/dev/null; then source=$base; else source=HEAD; fi
            echo "$file from $source"
            git show "$source:$file" > "$RUNNER_TEMP/checks/$(basename "$file")"
          done
          # The ignore file only ever comes from the base: a pull request
          # that adds one cannot silence a finding in itself.
          if git cat-file -e "$base:.gitleaksignore" 2>/dev/null; then
            git show "$base:.gitleaksignore" > "$RUNNER_TEMP/checks/ignore/.gitleaksignore"
          fi
      - name: Attribution in the commits
        env:
          RANGE: ${{ steps.range.outputs.range }}
        run: node "$RUNNER_TEMP/checks/check-attribution.mjs" --range "$RANGE"
      - name: Attribution in the pull request title and description
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
        run: printf '%s\n\n%s\n' "$TITLE" "$BODY" | node "$RUNNER_TEMP/checks/check-attribution.mjs" --stdin
      - name: Attribution in the files
        run: node "$RUNNER_TEMP/checks/check-attribution.mjs" --files
      - name: Install gitleaks
        run: sh "$RUNNER_TEMP/checks/install-gitleaks.sh" "$RUNNER_TEMP/bin"
      # `--ignore-gitleaks-allow`: a `gitleaks:allow` comment in the pull
      # request does not hide its own secret.
      - name: Secret scan of the commits
        env:
          RANGE: ${{ steps.range.outputs.range }}
        run: >-
          "$RUNNER_TEMP/bin/gitleaks" git --log-opts="$RANGE" --redact --no-banner
          --config "$RUNNER_TEMP/checks/.gitleaks.toml"
          --gitleaks-ignore-path "$RUNNER_TEMP/checks/ignore"
          --ignore-gitleaks-allow
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Dependency audit
        run: pnpm audit --audit-level high

  unit:
    name: unit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The secret-scan and Git hook tests run the real gitleaks binary.
      - name: Install gitleaks
        run: |
          scripts/install-gitleaks.sh "$RUNNER_TEMP"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - run: pnpm test

  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      # A marker, so the bundle check can prove a server value never reaches
      # the browser. Not a real key.
      RESEND_API_KEY: re_ci_marker_not_a_real_key
      SUPABASE_SECRET_KEY: ci_marker_secret_key_not_a_real_key
      DELETION_NOTICE_FROM: ci-marker-from@example.com
      DELETION_NOTICE_TO: ci-marker-to@example.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: No server variable in a browser bundle
        run: node scripts/check-bundle.mjs .next/static
      # A prerendered page carries no nonce, so the policy blocks its scripts.
      - name: No prerendered page
        run: node scripts/check-static.mjs .next

  # Every migration on an empty database, then the policy, trigger and
  # function tests (docs/spec/07-operations.md section 2.1; WP-2.1).
  db:
    name: db
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the Supabase CLI
        run: |
          mkdir "$RUNNER_TEMP/bin"
          scripts/install-supabase.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Start the local stack, applying every migration and the seed to an empty database
        run: supabase start
      - name: Policy, trigger and function tests
        run: supabase test db

  # The journeys on the production build in Chromium, and the ones that need
  # the local stack: the email code journey reads its code from the stack's
  # mail catcher (docs/spec/07-operations.md section 2.1; WP-2.2).
  e2e:
    name: e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install the Supabase CLI
        run: |
          mkdir "$RUNNER_TEMP/bin"
          scripts/install-supabase.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Start the local stack
        run: supabase start
      # The local stack's publishable key is the same on every machine and
      # is not a secret; the app needs it to reach the stack.
      - name: Point the app at the local stack
        run: |
          key="$(supabase status -o env | sed -n 's/^PUBLISHABLE_KEY="\(.*\)"$/\1/p')"
          test -n "$key"
          echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$key" >> "$GITHUB_ENV"
      # J-10 deletes an account, which takes the local stack's secret key and
      # the two notice addresses (WP-6.3). The key is the local stack's own,
      # generated by the CLI; it opens nothing outside this runner. The notice
      # goes to Resend with the fake key of .env.example, which refuses it, and
      # a deletion never waits on its email (ADR-0030).
      - name: Let the app delete accounts on the local stack
        run: |
          secret="$(supabase status -o env | sed -n 's/^SECRET_KEY="\(.*\)"$/\1/p')"
          test -n "$secret"
          echo "::add-mask::$secret"
          {
            echo "SUPABASE_SECRET_KEY=$secret"
            echo "DELETION_NOTICE_FROM=journeys@example.test"
            echo "DELETION_NOTICE_TO=owner@example.test"
          } >> "$GITHUB_ENV"
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e --project=chromium --project=stack --project=gallery
